name: Release

# Releases are driven by the VERSION file. Bump it, push to main, and this
# workflow tags and publishes automatically:
#
#   echo 0.3.0 > VERSION
#   git commit -am "Release 0.3.0" && git push
#
# Pushing a tag by hand also works. A manual run from the Actions tab builds
# and uploads the archives as artifacts without publishing anything.
#
# Tagging happens inside this workflow rather than in a separate one on
# purpose: a tag pushed with GITHUB_TOKEN does not trigger further workflow
# runs, so a split design would build nothing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide what to build
        id: plan
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
            release=true
            reason="tag $version was pushed"
          else
            if [ ! -f VERSION ]; then
              echo "::error::VERSION file is missing"
              exit 1
            fi

            raw="$(tr -d '[:space:]' < VERSION)"
            # Reject anything that is not semver, so a typo cannot publish a
            # release named after whatever ended up in the file.
            if ! printf '%s' "$raw" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
              echo "::error::VERSION must look like 1.2.3, got '$raw'"
              exit 1
            fi
            version="v$raw"

            if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
              release=false
              reason="$version is already tagged, nothing to do"
            elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              release=false
              reason="manual run, building $version without publishing"
            else
              release=true
              reason="VERSION names $version, which is not tagged yet"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "**$version** — $reason" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    # Skip entirely when VERSION has not moved; ci.yml already covers plain pushes.
    if: needs.plan.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          # There are no dependencies and so no go.sum to key a cache on.
          cache: false

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          if [ "$GOOS" = "windows" ]; then
            bin="vlsub-go.exe"
          else
            bin="vlsub-go"
          fi

          # -trimpath keeps absolute runner paths out of the binary, and
          # -s -w drops the symbol table and DWARF data.
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$bin" .

          name="vlsub-go_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          mv "$bin" "dist/$name/"
          cp README.md LICENSE "dist/$name/"

          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -qr "${name}.zip" "$name"
          else
            tar -czf "${name}.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          # Globs are listed explicitly so the checksum file cannot include itself.
          sha256sum vlsub-go_*.tar.gz vlsub-go_*.zip | tee checksums.txt

      - name: Publish release
        env:
          # The built-in token is enough; no PAT required.
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          # gh creates the tag itself when it does not exist, pointing at this
          # commit, which is why no separate tag push is needed.
          gh release create "$VERSION" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            dist/*

          echo "Published $VERSION" >> "$GITHUB_STEP_SUMMARY"
